<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>KazNU AR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
    }
  </style>
</head>

<body>

<a-scene
mindar-image="imageTargetSrc: ./targets/targets.mind;"
color-space="sRGB"
renderer="colorManagement: true;
physicallyCorrectLights: true;
exposure: 1.2"
vr-mode-ui="enabled:false"
device-orientation-permission-ui="enabled:false">

<a-assets>

<a-asset-item
id="campus"
src="./assets/main.glb">
</a-asset-item>

</a-assets>

<a-light
  type="ambient"
  color="#ffffff"
  intensity="1.2">
</a-light>

<a-light
  type="directional"
  color="#ffffff"
  intensity="1.0"
  position="2 4 3">
</a-light>
  
<a-camera
position="0 0 0"
look-controls="enabled:false">
</a-camera>

<a-entity mindar-image-target="targetIndex:0">

<a-gltf-model
src="#campus"
position="0 0 0"
rotation="0 0 0"
scale="0.02 0.02 0.02">
</a-gltf-model>

</a-entity>

</a-scene>

</body>
</html>
