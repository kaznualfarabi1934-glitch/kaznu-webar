<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>KazNU AR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
  </style>
</head>

<body>

<a-scene
  mindar-image="imageTargetSrc: ./targets/targets.mind; filterMinCF:0.001; filterBeta:0.0001;"
  color-space="sRGB"
  renderer="colorManagement: true; physicallyCorrectLights: true; exposure: 1.2"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <a-asset-item
      id="campus"
      src="./assets/main.glb">
    </a-asset-item>
  </a-assets>

  <!-- Свет -->
  <a-light
    type="ambient"
    intensity="1.2">
  </a-light>

  <a-light
    type="directional"
    intensity="1"
    position="3 5 2">
  </a-light>

  <!-- Камера -->
  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <!-- Маркер -->
  <a-entity mindar-image-target="targetIndex: 0">

    <a-gltf-model
      src="#campus"
      position="0 0 0"
      rotation="90 0 0"
      scale="0.03 0.03 0.03">
    </a-gltf-model>

  </a-entity>

</a-scene>

</body>
</html>
